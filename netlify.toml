# Netlify Konfigurationsdatei für Hall Escape

[build]
  command = "npm run build"
  publish = "."

# Erweiterte Security-Header gegen Angriffsversuche
[[headers]]
  for = "/*"
  [headers.values]
    # Klickjacking Schutz
    X-Frame-Options = "DENY"
    # XSS Schutz
    X-XSS-Protection = "1; mode=block"
    # MIME-Type Sniffing verhindern
    X-Content-Type-Options = "nosniff"
    # Privatsphäre bei externen Links
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Zugriff auf Browser-Hardware einschränken
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # HTTPS Erzwingung (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Robuste Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
